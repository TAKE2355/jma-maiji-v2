name: NIMBUS OFFLINE Cache

on:
  workflow_dispatch:
  schedule:
    # GitHubのスケジュールは遅延・欠落が多いため15分ごとに設定（実際は間引かれる）
    - cron: '3,18,33,48 * * * *'

concurrency:
  group: offline-cache
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fonts
        run: sudo apt-get install -y fonts-noto-cjk

      - name: Install Python packages
        run: pip install requests pillow img2pdf pymupdf

      - name: Collect images
        env:
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          METAIR_USER: ${{ secrets.METAIR_USER }}
          METAIR_PASS: ${{ secrets.METAIR_PASS }}
        run: python offline_collect.py

      - name: Force push to orphan branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q
          git checkout -q -b offline-cache
          git add -A
          git -c user.name="nimbus-offline" -c user.email="nimbus@local" \
              commit -q -m "offline cache $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" offline-cache
          echo "pushed: $(ls | wc -l) files"
          echo "SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Publish cache version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "nimbus-offline"
          git config user.email "nimbus@local"
          echo "$SHA" > cache-ver.txt
          git add cache-ver.txt
          git commit -q -m "chore: cache version $SHA" || exit 0
          git pull --rebase -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main || true
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
