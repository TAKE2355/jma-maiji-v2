name: NIMBUS OFFLINE Cache

on:
  workflow_dispatch:
    inputs:
      only:
        description: "集めるカテゴリID（カンマ区切り。空なら全部）"
        required: false
        default: ""
  schedule:
    # GitHubのスケジュールは遅延・欠落が多い（実際は数時間に1回）
    - cron: '3,33 * * * *'

concurrency:
  group: offline-cache
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fonts
        run: sudo apt-get install -y fonts-noto-cjk

      - name: Install Python packages
        run: pip install requests pillow img2pdf pymupdf

      - name: Restore previous snapshot
        if: ${{ github.event.inputs.only != '' }}
        run: |
          git clone --depth 1 --branch offline-cache \
            "https://github.com/${GITHUB_REPOSITORY}.git" out 2>/dev/null || true
          rm -rf out/.git 2>/dev/null || true
          echo "restored: $(ls out 2>/dev/null | wc -l) files"

      - name: Collect images
        env:
          ONLY: ${{ github.event.inputs.only }}
          START_TS: ''
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          METAIR_USER: ${{ secrets.METAIR_USER }}
          METAIR_PASS: ${{ secrets.METAIR_PASS }}
        run: |
          echo "START_TS=$(date +%s)" >> $GITHUB_ENV
          python offline_collect.py

      - name: Force push to orphan branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q
          git checkout -q -b offline-cache
          git add -A
          git -c user.name="nimbus-offline" -c user.email="nimbus@local" \
              commit -q -m "offline cache $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" offline-cache
          echo "pushed: $(ls | wc -l) files"
          echo "SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "NFILES=$(ls | wc -l)" >> $GITHUB_ENV

      - name: ALWIN archive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf arch
          git clone -q --depth 1 --branch alwin-archive "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" arch 2>/dev/null || mkdir -p arch
          rm -rf arch/.git
          python3 alwin_archive.py
          python3 - <<'PY'
          import json, os
          try:
              idx = json.load(open(os.path.join("arch","index.json"), encoding="utf-8"))
          except Exception:
              idx = {"frames":{}}
          repo = os.environ.get("GITHUB_REPOSITORY","")
          idx["base"] = "https://raw.githubusercontent.com/"+repo+"/alwin-archive/"
          json.dump(idx, open("alwin_archive.json","w"), ensure_ascii=False, separators=(",",":"))
          PY
          cd arch
          git init -q
          git checkout -q -b alwin-archive
          git add -A
          git -c user.name="nimbus-offline" -c user.email="nimbus@local" \
              commit -q -m "alwin archive $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" alwin-archive
          echo "alwin archived: $(ls | wc -l) files"
      - name: Publish cache version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "nimbus-offline"
          git config user.email "nimbus@local"
          git pull --rebase --autostash -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main || true
          echo "$SHA" > cache-ver.txt
          python3 - <<'PY'
          import json, os, time
          p = 'cache-log.json'
          try:
              L = json.load(open(p))
          except Exception:
              L = []
          now = int(time.time())
          L.append({"t": now,
                    "d": (now - int(os.environ.get("START_TS", "0") or 0)) if os.environ.get("START_TS") else 0,
                    "n": int(os.environ.get("NFILES", "0") or 0),
                    "e": os.environ.get("GITHUB_EVENT_NAME", ""),
                    "s": (os.environ.get("SHA", "") or "")[:7]})
          L = [x for x in L if x.get("t", 0) > now - 8 * 86400][-900:]
          json.dump(L, open(p, 'w'), separators=(',', ':'))
          PY
          git add cache-ver.txt cache-log.json alwin_archive.json
          git commit -q -m "chore: cache version $SHA" || exit 0
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
