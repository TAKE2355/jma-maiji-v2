name: probe
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pillow img2pdf pymupdf
      - env:
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          METAIR_USER: ${{ secrets.METAIR_USER }}
          METAIR_PASS: ${{ secrets.METAIR_PASS }}
        run: python probe_pagasa.py