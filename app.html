<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1012">
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>NIMBUS OFFLINE</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>

:root{--bg:#0e1012;--card:#17191c;--line:#2a2e33;--text:#e8eaed;--sub:#8b9096;--danger:#e82127;--ok:#3ddc84;
--font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;overflow:hidden;}
header{position:sticky;top:0;z-index:20;background:rgba(14,16,18,.96);border-bottom:1px solid var(--line);
 padding:5px 8px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;}
.btn{background:var(--danger);color:#fff;border:0;border-radius:6px;padding:7px 12px;font-size:12.5px;
 font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:.04em;}
.btn:disabled{opacity:.5;}
.bar{display:flex;gap:8px;align-items:center;margin-left:auto;}
.stamp{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;}
.ver{font-size:10px;color:#5c6268;letter-spacing:.04em;}
.stamp b{color:var(--text);}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;display:none;width:100%;}
.prog>i{display:block;height:100%;width:0;background:var(--ok);transition:width .12s;}
nav.cats,.subs{display:flex;gap:5px;overflow-x:auto;padding:5px 8px;-webkit-overflow-scrolling:touch;
 align-items:center;}
nav.cats{border-bottom:1px solid var(--line);}
nav.cats button,.subs button.sb{white-space:nowrap;background:var(--card);color:var(--sub);
 border:1px solid var(--line);border-radius:5px;padding:5px 10px;font-size:12px;font-weight:600;
 font-family:inherit;cursor:pointer;}
nav.cats button.active,.subs button.sb.active{background:var(--danger);border-color:var(--danger);color:#fff;}

/* 左端の操作群 */
.tools{display:flex;gap:5px;align-items:center;flex:0 0 auto;padding-right:6px;
 border-right:1px solid var(--line);margin-right:3px;}
.tools button{background:#2f353c;border:1px solid var(--line);color:var(--text);border-radius:5px;
 width:34px;height:28px;font-size:14px;font-family:inherit;cursor:pointer;}
.ovl button, .tools.left button{cursor:pointer;font-family:inherit;}

.tools button.tg{width:auto;min-width:34px;padding:0 8px;font-size:11.5px;font-weight:700;}
.tools{display:flex;gap:5px;align-items:center;flex:0 0 auto;}
.tools.left{border-right:1px solid var(--line);padding-right:6px;margin-right:3px;}
.tools.right{border-left:1px solid var(--line);padding-left:6px;margin-left:auto;}
.tools select{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:5px;
 padding:4px 5px;font-size:11.5px;font-family:inherit;}
.tools .lbl{color:var(--sub);font-size:11px;}

/* 画像エリア */
main{padding:2px;}
#gwrap{overflow:auto;overscroll-behavior:contain;touch-action:pan-x pan-y;}
#grid{display:grid;gap:2px;align-content:start;align-items:start;grid-auto-rows:min-content;width:100%;}
.tile{position:relative;background:#000;border:0;border-radius:3px;overflow:hidden;
 display:block;line-height:0;cursor:zoom-in;}
#grid.zoom .tile{cursor:zoom-out;}
.tile img{width:100%;height:auto;display:block;}
#grid.zoom .tile img{width:100%;height:100%;max-width:none;max-height:none;object-fit:contain;margin:0 auto;}
#grid.zoom .tile{display:flex;align-items:center;justify-content:center;}
.tile .tag{position:absolute;left:0;top:0;background:rgba(0,0,0,.72);color:#ffd76a;font-weight:800;
 font-size:16px;line-height:1.5;letter-spacing:.04em;padding:6px 12px 6px;border-bottom-right-radius:8px;
 pointer-events:none;opacity:0;transition:opacity .45s;text-shadow:0 1px 3px #000;white-space:nowrap;}
.tile.tagon .tag{opacity:1;}
@media (max-width:640px){ .tile .tag{font-size:13px;padding:2px 8px;} }
.ovl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 display:flex;align-items:center;gap:8px;
 padding:8px 12px;background:rgba(0,0,0,.60);border:1px solid rgba(255,255,255,.18);
 border-radius:10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
 opacity:0;transition:opacity .35s;pointer-events:none;}
.tile.act .ovl, .tile.actcap .ovl{opacity:1;pointer-events:auto;}
.tile:not(.act) .ovl button{display:none}
.tile:not(.actcap) .ovl .cap{display:none}
.ovl button{background:rgba(30,34,39,.9);border:1px solid #3a4048;color:#fff;border-radius:4px;
 width:28px;height:24px;font-size:11px;font-family:inherit;cursor:pointer;padding:0;}
/* 再生UI（テスラ調：フラット・細い枠・余計な装飾なし） */
.ovl button, .tools.left button{
  background:rgba(10,12,14,.72); border:1px solid rgba(255,255,255,.20); color:#eceff2;
  border-radius:3px; width:36px; height:26px; padding:0;
  display:inline-flex; align-items:center; justify-content:center;
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  transition:background .15s, border-color .15s, color .15s;
}
.ovl button:hover, .tools.left button:hover{ border-color:rgba(255,255,255,.45); background:rgba(20,24,28,.85); }
.ovl button:active, .tools.left button:active{ background:rgba(255,255,255,.14); }
.ovl button.p, .tools.left button#bulk{ color:var(--danger); }
.ovl button.p.playing, .tools.left button#bulk.playing{ background:#000; border-color:rgba(255,255,255,.35); color:#fff; }
.ovl .cap{color:#fff;font-size:21px;line-height:26px;font-weight:600;letter-spacing:.02em;
 font-variant-numeric:tabular-nums;margin-left:auto;
 white-space:nowrap;text-shadow:0 1px 2px #000;}

/* METAR/TAF */
#textview{display:none;white-space:pre-wrap;word-break:break-word;background:#000;color:#e8eaed;
 border:1px solid var(--line);border-radius:8px;margin:0;padding:0;overflow:auto;
 font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;}
.mt-h{background:#26292e;color:#ffd76a;font-weight:800;letter-spacing:.10em;font-size:17px;
 line-height:1.35;padding:4px 9px;border-top:1px solid #000;position:sticky;top:0;}
.mt-b{white-space:pre-wrap;word-break:break-word;padding:4px 9px 7px;color:#dfe3e7;}
.empty{color:var(--sub);padding:24px 6px;font-size:13px;line-height:1.7;}

/* ヘッダのタイトル枠 */
.hero{display:flex;align-items:center;gap:7px;flex:0 0 auto;}
.hero .sub{display:none;}
#nimbus-logo{font-family:'Orbitron',var(--font);font-size:15px;letter-spacing:.09em;font-weight:900;
 color:var(--danger);margin:0;white-space:nowrap;}
.radar-icon,.radar-icon img,.radar-icon svg{width:48px !important;height:48px !important;flex:0 0 48px !important;}
@media (max-width:640px){
  #nimbus-logo{font-size:13px;}
  .radar-icon,.radar-icon img,.radar-icon svg{width:40px !important;height:40px !important;flex:0 0 40px !important;}
  nav.cats button,.subs button.sb{font-size:11px;padding:4px 8px;}
  .mt-h{font-size:15px;}
}

/* TOPアイコン: レーダースイープ回転 */
.radar-icon{position:relative;width:132px;height:132px;line-height:0;}
.radar-icon .radar-sweep{
  position:absolute; left:48.96%; top:51.04%;
  width:89.6%; height:89.6%; border-radius:50%;
  transform:translate(-50%,-50%); z-index:0; pointer-events:none;
  background:conic-gradient(from 0deg,
    rgba(74,235,102,0)   0deg,
    rgba(74,235,102,0)   304deg,
    rgba(74,235,102,.12) 320deg,
    rgba(74,235,102,.40) 344deg,
    rgba(74,235,102,.85) 359deg,
    rgba(74,235,102,.85) 360deg);
  -webkit-mask:radial-gradient(closest-side,#000 0%,#000 84%,transparent 100%);
          mask:radial-gradient(closest-side,#000 0%,#000 84%,transparent 100%);
  animation:radar-sweep-spin 3.2s linear infinite;
}
@keyframes radar-sweep-spin{
  from{transform:translate(-50%,-50%) rotate(0deg);}
  to  {transform:translate(-50%,-50%) rotate(360deg);}
}
@media (prefers-reduced-motion: reduce){
  .radar-icon .radar-sweep{animation:none;}
}

/* TOPアイコン: 稲光フラッシュ */
.radar-icon .radar-bolt{
  position:absolute; left:0; top:0; z-index:2; opacity:0; pointer-events:none;


}
.radar-icon .radar-bolt.flash{animation:radar-bolt-flash .42s linear 1;}
@keyframes radar-bolt-flash{
  0%  {opacity:0;   filter:none;}
  8%  {opacity:1;   filter:brightness(2.4) drop-shadow(0 0 6px rgba(255,190,190,1)) drop-shadow(0 0 16px rgba(255,60,60,.95));}
  22% {opacity:.12; filter:brightness(1.2);}
  38% {opacity:1;   filter:brightness(2.6) drop-shadow(0 0 7px rgba(255,210,210,1)) drop-shadow(0 0 18px rgba(255,60,60,1));}
  58% {opacity:.18; filter:brightness(1.2);}
  74% {opacity:.85; filter:brightness(2.0) drop-shadow(0 0 5px rgba(255,180,180,.9)) drop-shadow(0 0 12px rgba(255,60,60,.8));}
  100%{opacity:0;   filter:none;}
}
@media (prefers-reduced-motion: reduce){
  .radar-icon .radar-bolt{animation:none !important;}
}

/* TOPアイコン: 飛行機のレーダーブリップ減衰
   スイープ(3.2s/周)が飛行機の方位305.5degを通過した瞬間に最大輝度、
   一周かけて減衰し、次の通過直前に最小になる */
.radar-icon .radar-plane{
  position:absolute; left:0; top:0; z-index:1; pointer-events:none;
  animation:radar-plane-blip 3.2s linear infinite;
  animation-delay:-1.067s;   /* 3.2s * 240/360 - 3.2s → 240deg(8時)で最大、210degで最小 */
}
@keyframes radar-plane-blip{
  /* 0% = スイープ240deg（最高輝度） 91.667% = 210deg（最低輝度） */
  0%      {opacity:1;   filter:brightness(2.2) drop-shadow(0 0 5px rgba(190,255,205,1)) drop-shadow(0 0 13px rgba(110,255,150,.95));}
  7%      {opacity:.94; filter:brightness(1.75) drop-shadow(0 0 4px rgba(160,255,185,.85)) drop-shadow(0 0 10px rgba(110,255,150,.6));}
  20%     {opacity:.72; filter:brightness(1.32) drop-shadow(0 0 3px rgba(120,255,160,.5));}
  40%     {opacity:.46; filter:brightness(1.12) drop-shadow(0 0 2px rgba(120,255,160,.25));}
  62%     {opacity:.28; filter:brightness(1);}
  80%     {opacity:.15; filter:brightness(1);}
  91.667% {opacity:.06; filter:brightness(1);}
  100%    {opacity:1;   filter:brightness(2.2) drop-shadow(0 0 5px rgba(190,255,205,1)) drop-shadow(0 0 13px rgba(110,255,150,.95));}
}
@media (prefers-reduced-motion: reduce){
  .radar-icon .radar-plane{animation:none; opacity:1;}
}

/* ══ NIMBUS ロゴ演出（30秒ごとに10種からランダム） ══ */
.nb-l{ display:inline-block; will-change:transform,opacity,filter; }
#nimbus-logo .nb-l{ animation-fill-mode:both; }
@media (prefers-reduced-motion: reduce){ .nb-l{animation:none !important;} }

/* 1. スイープ発光: N→S へ1秒で1文字ずつ */
.fx1 .nb-l{animation:nbf-glow .34s linear 1; animation-delay:calc(var(--i)*.14s);}
@keyframes nbf-glow{
  0%,100%{color:var(--danger); text-shadow:none;}
  35%{color:#fff5f5; text-shadow:0 0 10px rgba(255,70,70,1),0 0 26px rgba(255,45,45,.85),0 0 48px rgba(255,45,45,.5);}
}
/* 2. ネオン管の点灯不良 */
.fx2 .nb-l{animation:nbf-neon 2.2s linear 1; animation-delay:calc(var(--i)*.05s);}
@keyframes nbf-neon{
  0%,7%,13%,22%,29%,44%{opacity:.15; text-shadow:none;}
  4%,10%,18%,26%,36%{opacity:1; text-shadow:0 0 12px rgba(255,60,60,.9);}
  55%,100%{opacity:1; color:var(--danger); text-shadow:0 0 8px rgba(255,60,60,.35);}
}
/* 3. ウェーブ（上下に波打つ） */
.fx3 .nb-l{animation:nbf-wave 1.1s cubic-bezier(.36,.07,.19,.97) 1; animation-delay:calc(var(--i)*.08s);}
@keyframes nbf-wave{
  0%,100%{transform:translateY(0);}
  30%{transform:translateY(-13px); text-shadow:0 6px 14px rgba(255,45,45,.55);}
  60%{transform:translateY(4px);}
}
/* 4. ポップ拡大 */
.fx4 .nb-l{animation:nbf-pop 0.9s cubic-bezier(.34,1.56,.64,1) 1; animation-delay:calc(var(--i)*.09s);}
@keyframes nbf-pop{
  0%,100%{transform:scale(1); color:var(--danger);}
  40%{transform:scale(1.55); color:#fff2f2; text-shadow:0 0 18px rgba(255,60,60,.95);}
}
/* 5. スペクトル（色が流れる） */
.fx5 .nb-l{animation:nbf-spectrum 1.8s linear 1; animation-delay:calc(var(--i)*.11s);}
@keyframes nbf-spectrum{
  0%,100%{color:var(--danger); text-shadow:none;}
  20%{color:#ffd54a; text-shadow:0 0 14px rgba(255,213,74,.8);}
  45%{color:#5ef2a0; text-shadow:0 0 14px rgba(94,242,160,.8);}
  70%{color:#5ec8ff; text-shadow:0 0 14px rgba(94,200,255,.8);}
}
/* 6. グリッチ（RGBずれ＋横滑り） */
.fx6 .nb-l{animation:nbf-glitch 0.9s steps(2,end) 1; animation-delay:calc(var(--i)*.03s);}
@keyframes nbf-glitch{
  0%,100%{transform:translate(0); text-shadow:none;}
  10%{transform:translate(-4px,1px); text-shadow:3px 0 rgba(0,255,255,.9),-3px 0 rgba(255,0,90,.9);}
  25%{transform:translate(4px,-2px); text-shadow:-4px 0 rgba(0,255,255,.9),4px 0 rgba(255,0,90,.9);}
  45%{transform:translate(-3px,2px); text-shadow:2px 0 rgba(0,255,255,.7),-2px 0 rgba(255,0,90,.7);}
  70%{transform:translate(2px,0); text-shadow:-2px 0 rgba(0,255,255,.5),2px 0 rgba(255,0,90,.5);}
}
/* 7. 左から現れる（リビール） */
.fx7 .nb-l{animation:nbf-reveal 1.2s ease-out 1; animation-delay:calc(var(--i)*.1s);}
@keyframes nbf-reveal{
  0%{opacity:0; transform:translateX(-16px) scale(.8); filter:blur(4px);}
  55%{opacity:1; transform:translateX(0) scale(1); filter:blur(0); text-shadow:0 0 16px rgba(255,60,60,.85);}
  100%{opacity:1; transform:translateX(0); text-shadow:none;}
}
/* 8. ショックウェーブ（全文字同時に閃光） */
.fx8 .nb-l{animation:nbf-shock 1.1s ease-out 1;}
@keyframes nbf-shock{
  0%{transform:scale(1);}
  12%{transform:scale(1.18); color:#fff; text-shadow:0 0 26px rgba(255,255,255,1),0 0 60px rgba(255,50,50,.9);}
  45%{transform:scale(.97); color:var(--danger); text-shadow:0 0 30px rgba(255,50,50,.35);}
  100%{transform:scale(1); text-shadow:none;}
}
/* 9. Y軸フリップ */
.fx9 .nb-l{animation:nbf-flip 1.3s ease-in-out 1; animation-delay:calc(var(--i)*.1s);}
@keyframes nbf-flip{
  0%,100%{transform:rotateY(0);}
  50%{transform:rotateY(360deg); color:#fff2f2; text-shadow:0 0 16px rgba(255,60,60,.9);}
}
/* 10. ストロボ（全体が高速点滅） */
.fx10 .nb-l{animation:nbf-strobe 1.05s steps(1,end) 1;}
@keyframes nbf-strobe{
  0%,20%,40%,60%,80%{color:var(--danger); text-shadow:none;}
  10%,30%,50%,70%{color:#fff; text-shadow:0 0 20px rgba(255,255,255,.95),0 0 44px rgba(255,50,50,.8);}
  100%{color:var(--danger); text-shadow:none;}
}

/* 11. タイプライター */
.fx11 .nb-l{animation:nbf-type .5s steps(1,end) 1; animation-delay:calc(var(--i)*.13s);}
@keyframes nbf-type{0%{opacity:0}40%{opacity:0;color:#fff}41%,100%{opacity:1;color:var(--danger)}}
/* 12. 落下バウンド */
.fx12 .nb-l{animation:nbf-drop 1.1s cubic-bezier(.34,1.56,.64,1) 1; animation-delay:calc(var(--i)*.07s);}
@keyframes nbf-drop{0%{transform:translateY(-46px);opacity:0}55%{transform:translateY(6px);opacity:1}75%{transform:translateY(-3px)}100%{transform:translateY(0)}}
/* 13. 下から浮上 */
.fx13 .nb-l{animation:nbf-rise 1s ease-out 1; animation-delay:calc(var(--i)*.08s);}
@keyframes nbf-rise{0%{transform:translateY(24px);opacity:0;filter:blur(3px)}60%{opacity:1;filter:blur(0)}100%{transform:translateY(0);opacity:1}}
/* 14. スピンイン */
.fx14 .nb-l{animation:nbf-spin 1.1s cubic-bezier(.22,1,.36,1) 1; animation-delay:calc(var(--i)*.08s);}
@keyframes nbf-spin{0%{transform:rotate(-200deg) scale(.4);opacity:0}70%{opacity:1}100%{transform:rotate(0) scale(1);opacity:1}}
/* 15. ぼかしパルス */
.fx15 .nb-l{animation:nbf-blur 1.4s ease-in-out 1;}
@keyframes nbf-blur{0%,100%{filter:blur(0)}45%{filter:blur(5px);color:#ff8a8a}}
/* 16. 伸縮 */
.fx16 .nb-l{animation:nbf-stretch 1s cubic-bezier(.34,1.56,.64,1) 1; animation-delay:calc(var(--i)*.07s);}
@keyframes nbf-stretch{0%,100%{transform:scale(1,1)}30%{transform:scale(.6,1.5)}60%{transform:scale(1.35,.75)}}
/* 17. シェイク */
.fx17 .nb-l{animation:nbf-shake .8s linear 1; animation-delay:calc(var(--i)*.02s);}
@keyframes nbf-shake{0%,100%{transform:translate(0)}15%{transform:translate(-5px,2px)}30%{transform:translate(5px,-2px)}45%{transform:translate(-4px,-2px)}60%{transform:translate(4px,2px)}80%{transform:translate(-2px,0)}}
/* 18. ホップ */
.fx18 .nb-l{animation:nbf-hop 1.15s ease-in-out 1; animation-delay:calc(var(--i)*.1s);}
@keyframes nbf-hop{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(-20px) rotate(-14deg)}70%{transform:translateY(0) rotate(6deg)}}
/* 19. フェードカスケード */
.fx19 .nb-l{animation:nbf-cascade 1.2s ease-in-out 1; animation-delay:calc(var(--i)*.12s);}
@keyframes nbf-cascade{0%,100%{opacity:1}45%{opacity:.08}}
/* 20. レーザースキャン */
.fx20 .nb-l{animation:nbf-laser .32s linear 1; animation-delay:calc(var(--i)*.07s);}
@keyframes nbf-laser{0%,100%{color:var(--danger);text-shadow:none}50%{color:#fff;text-shadow:0 0 6px #fff,0 0 22px rgba(255,255,255,.9),0 0 40px rgba(255,60,60,.8)}}
/* 21. ハートビート */
.fx21 .nb-l{animation:nbf-beat 1.3s ease-in-out 1;}
@keyframes nbf-beat{0%,100%{transform:scale(1)}12%{transform:scale(1.22);text-shadow:0 0 18px rgba(255,60,60,.9)}24%{transform:scale(1)}36%{transform:scale(1.16)}50%{transform:scale(1)}}
/* 22. スキュー */
.fx22 .nb-l{animation:nbf-skew 1s ease-in-out 1; animation-delay:calc(var(--i)*.06s);}
@keyframes nbf-skew{0%,100%{transform:skewX(0)}35%{transform:skewX(-24deg)}70%{transform:skewX(12deg)}}
/* 23. ゴールドシマー */
.fx23 .nb-l{animation:nbf-gold 1.6s ease-in-out 1; animation-delay:calc(var(--i)*.1s);}
@keyframes nbf-gold{0%,100%{color:var(--danger);text-shadow:none}40%{color:#ffd76a;text-shadow:0 0 10px rgba(255,215,106,.95),0 0 30px rgba(255,180,40,.7)}60%{color:#fff6d6;text-shadow:0 0 16px rgba(255,235,180,1)}}
/* 24. アイス */
.fx24 .nb-l{animation:nbf-ice 1.7s ease-in-out 1; animation-delay:calc(var(--i)*.09s);}
@keyframes nbf-ice{0%,100%{color:var(--danger);text-shadow:none}45%{color:#dff6ff;text-shadow:0 0 12px rgba(180,235,255,1),0 0 34px rgba(90,190,255,.75)}}
/* 25. ファイア */
.fx25 .nb-l{animation:nbf-fire 1.5s ease-in-out 1; animation-delay:calc(var(--i)*.06s);}
@keyframes nbf-fire{0%,100%{color:var(--danger);text-shadow:none}25%{color:#ff8c1a;text-shadow:0 -4px 12px rgba(255,140,26,.9)}45%{color:#ffe14d;text-shadow:0 -8px 18px rgba(255,225,77,.95)}70%{color:#ff5a1a;text-shadow:0 -5px 14px rgba(255,90,26,.8)}}
/* 26. エレクトリック */
.fx26 .nb-l{animation:nbf-elec .9s steps(2,end) 1; animation-delay:calc(var(--i)*.04s);}
@keyframes nbf-elec{0%,100%{color:var(--danger);text-shadow:none}15%{color:#cfefff;text-shadow:0 0 8px #7fd7ff,0 0 24px #2aa8ff}35%{color:var(--danger);text-shadow:none}55%{color:#fff;text-shadow:0 0 10px #9be3ff,0 0 30px #1f9dff}75%{color:var(--danger)}}
/* 27. 逆順バウンス（S→N） */
.fx27 .nb-l{animation:nbf-pop2 .9s cubic-bezier(.34,1.56,.64,1) 1; animation-delay:calc((var(--last) - var(--i))*.09s);}
@keyframes nbf-pop2{0%,100%{transform:scale(1)}40%{transform:scale(1.45);color:#fff2f2;text-shadow:0 0 16px rgba(255,60,60,.95)}}
/* 28. 逆スイープ発光（S→N） */
.fx28 .nb-l{animation:nbf-glow .34s linear 1; animation-delay:calc((var(--last) - var(--i))*.14s);}
/* 29. 3D回転 */
.fx29 .nb-l{animation:nbf-orbit 1.4s ease-in-out 1; animation-delay:calc(var(--i)*.09s);}
@keyframes nbf-orbit{0%,100%{transform:perspective(400px) rotateX(0) scale(1)}50%{transform:perspective(400px) rotateX(360deg) scale(1.12);color:#fff2f2}}
/* 30. X軸フリップ */
.fx30 .nb-l{animation:nbf-flipx 1.1s ease-in-out 1; animation-delay:calc(var(--i)*.1s);}
@keyframes nbf-flipx{0%,100%{transform:perspective(400px) rotateX(0)}50%{transform:perspective(400px) rotateX(180deg);color:#ffb3b3}}

/* 31. 飛散から集合 */
.fx31 .nb-l{animation:nbf-gather 1.2s cubic-bezier(.22,1,.36,1) 1;}
.fx31 .nb-l:nth-child(1){--dx:-70px;--dy:-40px}
.fx31 .nb-l:nth-child(2){--dx:40px;--dy:-60px}
.fx31 .nb-l:nth-child(3){--dx:-50px;--dy:50px}
.fx31 .nb-l:nth-child(4){--dx:60px;--dy:40px}
.fx31 .nb-l:nth-child(5){--dx:-30px;--dy:-70px}
.fx31 .nb-l:nth-child(6){--dx:70px;--dy:-20px}
.fx31 .nb-l:nth-child(7){--dx:-80px;--dy:10px}
.fx31 .nb-l:nth-child(8){--dx:30px;--dy:70px}
.fx31 .nb-l:nth-child(9){--dx:-60px;--dy:-30px}
.fx31 .nb-l:nth-child(10){--dx:80px;--dy:-50px}
.fx31 .nb-l:nth-child(11){--dx:-20px;--dy:60px}
.fx31 .nb-l:nth-child(12){--dx:55px;--dy:-70px}
.fx31 .nb-l:nth-child(13){--dx:-45px;--dy:35px}
.fx31 .nb-l:nth-child(14){--dx:65px;--dy:55px}
@keyframes nbf-gather{0%{transform:translate(var(--dx),var(--dy)) rotate(90deg) scale(.5);opacity:0}100%{transform:translate(0,0) rotate(0) scale(1);opacity:1}}
/* 32. 字間を詰める */
.fx32{animation:nbf-squeeze 1.3s ease-in-out 1;}
@keyframes nbf-squeeze{0%,100%{letter-spacing:.2em}45%{letter-spacing:-.04em}}
/* 33. 字間を広げる */
.fx33{animation:nbf-widen 1.5s ease-in-out 1;}
@keyframes nbf-widen{0%,100%{letter-spacing:.2em}45%{letter-spacing:.62em}}
/* 34. ゆっくり点灯・消灯 */
.fx34 .nb-l{animation:nbf-slowglow 2.6s ease-in-out 1; animation-delay:calc(var(--i)*.05s);}
@keyframes nbf-slowglow{0%,100%{text-shadow:none;color:var(--danger)}50%{color:#fff0f0;text-shadow:0 0 14px rgba(255,60,60,1),0 0 42px rgba(255,40,40,.8),0 0 80px rgba(255,40,40,.5)}}
/* 35. ランダム明滅 */
.fx35 .nb-l{animation:nbf-rand 1.6s steps(1,end) 1; animation-delay:calc(var(--i)*.077s);}
@keyframes nbf-rand{0%,9%,23%,41%,58%,79%{opacity:1}5%,17%,33%,50%,68%,88%{opacity:.12}100%{opacity:1}}
/* 36. 色相回転 */
.fx36{animation:nbf-hue 2s linear 1;}
@keyframes nbf-hue{0%,100%{filter:hue-rotate(0)}50%{filter:hue-rotate(340deg) saturate(1.6)}}
/* 37. マトリクス落下 */
.fx37 .nb-l{animation:nbf-matrix 1.3s ease-out 1; animation-delay:calc(var(--i)*.09s);}
@keyframes nbf-matrix{0%{transform:translateY(-30px);opacity:0;color:#7CFF9B;text-shadow:0 0 12px rgba(124,255,155,.9)}45%{opacity:1;color:#7CFF9B;text-shadow:0 0 16px rgba(124,255,155,1)}100%{transform:translateY(0);opacity:1;color:var(--danger);text-shadow:none}}
/* 38. ネオンバズ */
.fx38 .nb-l{animation:nbf-buzz 1.2s steps(1,end) 1;}
@keyframes nbf-buzz{0%,100%{opacity:1;color:var(--danger);text-shadow:none}8%,24%,40%,56%{opacity:.5;color:#ff5cf0;text-shadow:0 0 14px rgba(255,92,240,.9)}16%,32%,48%,64%{opacity:1;color:#ffb3f7;text-shadow:0 0 22px rgba(255,92,240,1)}}
/* 39. 振り子 */
.fx39 .nb-l{animation:nbf-pend 1.4s ease-in-out 1; animation-delay:calc(var(--i)*.07s); transform-origin:50% 120%;}
@keyframes nbf-pend{0%,100%{transform:rotate(0)}25%{transform:rotate(-18deg)}55%{transform:rotate(13deg)}80%{transform:rotate(-5deg)}}
/* 40. ズームブラー */
.fx40 .nb-l{animation:nbf-zoomblur 1.1s cubic-bezier(.22,1,.36,1) 1;}
@keyframes nbf-zoomblur{0%{transform:scale(2.4);opacity:0;filter:blur(10px)}60%{opacity:1;filter:blur(0)}100%{transform:scale(1);opacity:1}}
/* 41. ミラー反転 */
.fx41 .nb-l{animation:nbf-mirror 1.2s ease-in-out 1; animation-delay:calc(var(--i)*.08s);}
@keyframes nbf-mirror{0%,100%{transform:scaleX(1)}45%{transform:scaleX(-1);color:#ffd0d0}}
/* 42. 3Dチルト */
.fx42{animation:nbf-tilt 1.6s ease-in-out 1;}
@keyframes nbf-tilt{0%,100%{transform:perspective(600px) rotateX(0) rotateY(0)}30%{transform:perspective(600px) rotateX(28deg) rotateY(-16deg)}65%{transform:perspective(600px) rotateX(-18deg) rotateY(12deg)}}
/* 43. ソナーピング */
.fx43 .nb-l{animation:nbf-ping 1.4s cubic-bezier(.22,1,.36,1) 1; animation-delay:calc(var(--i)*.06s);}
@keyframes nbf-ping{0%{transform:scale(1);text-shadow:0 0 0 rgba(255,60,60,.9)}25%{transform:scale(1.12);text-shadow:0 0 10px rgba(255,90,90,1),0 0 0 rgba(255,60,60,.6)}100%{transform:scale(1);text-shadow:0 0 60px rgba(255,60,60,0)}}
/* 44. スライスワイプ */
.fx44 .nb-l{animation:nbf-slice 1.1s ease-in-out 1; animation-delay:calc(var(--i)*.08s);}
@keyframes nbf-slice{0%{clip-path:inset(0 0 100% 0)}40%{clip-path:inset(0 0 0 0);color:#fff}70%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0);color:var(--danger)}}
/* 45. カラージッター */
.fx45 .nb-l{animation:nbf-jitter 1s steps(1,end) 1; animation-delay:calc(var(--i)*.03s);}
@keyframes nbf-jitter{0%,100%{color:var(--danger)}12%{color:#fff}24%{color:#3ee7ff}36%{color:var(--danger)}48%{color:#ffe14d}60%{color:#fff}72%{color:#ff3b8e}84%{color:var(--danger)}}
/* 46. スローウェーブ */
.fx46 .nb-l{animation:nbf-slowwave 2.4s ease-in-out 1; animation-delay:calc(var(--i)*.14s);}
@keyframes nbf-slowwave{0%,100%{transform:translateY(0)}25%{transform:translateY(-9px)}50%{transform:translateY(0)}75%{transform:translateY(6px)}}
/* 47. 収縮→復元 */
.fx47 .nb-l{animation:nbf-shrink 1.1s cubic-bezier(.34,1.56,.64,1) 1; animation-delay:calc(var(--i)*.06s);}
@keyframes nbf-shrink{0%,100%{transform:scale(1);opacity:1}40%{transform:scale(0) rotate(180deg);opacity:.2}}
/* 48. スポットライト */
.fx48 .nb-l{animation:nbf-spot 1.5s ease-in-out 1; animation-delay:calc(var(--i)*.11s);}
@keyframes nbf-spot{0%,100%{filter:brightness(.45)}40%{filter:brightness(2.6) drop-shadow(0 0 12px rgba(255,80,80,.95))}}
/* 49. CRT ON/OFF */
.fx49{animation:nbf-crt 1.2s ease-in-out 1;}
@keyframes nbf-crt{0%{transform:scaleY(1) scaleX(1);filter:brightness(1)}18%{transform:scaleY(.02) scaleX(1.1);filter:brightness(3)}30%{transform:scaleY(.02) scaleX(.4);filter:brightness(4)}45%{transform:scaleY(.02) scaleX(1);filter:brightness(2)}70%{transform:scaleY(1.08) scaleX(1);filter:brightness(1.6)}100%{transform:scaleY(1) scaleX(1);filter:brightness(1)}}
/* 50. ダブルスイープ */
.fx50 .nb-l{animation:nbf-double 1.4s linear 1; animation-delay:calc(var(--i)*.1s);}
@keyframes nbf-double{0%,100%{color:var(--danger);text-shadow:none}12%{color:#fff;text-shadow:0 0 12px rgba(255,60,60,1),0 0 30px rgba(255,45,45,.8)}24%{color:var(--danger);text-shadow:none}48%{color:#fff;text-shadow:0 0 12px rgba(255,60,60,1),0 0 30px rgba(255,45,45,.8)}62%{color:var(--danger);text-shadow:none}}

<script>
const $=id=>document.getElementById(id);
const APP_VER='ovlbr-260812';

// ── 自動更新: サーバ上の版と違えばキャッシュを捨てて読み込み直す ──
async function checkUpdate(){
  try{
    const r=await fetch(location.pathname.split('/').pop()+'?cb='+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    const t=await r.text();
    const m=t.match(/const APP_VER='([^']+)'/);
    if(!m || m[1]===APP_VER) return;
    try{
      const c=await caches.open(CACHE);
      for(const k of await c.keys()){
        if(/offline\.html|sw-offline\.js/.test(k.url)) await c.delete(k,{ignoreSearch:true});
      }
    }catch(e){}
    try{ for(const reg of await navigator.serviceWorker.getRegistrations()) await reg.update(); }catch(e){}
    location.reload();
  }catch(e){}
}
window.addEventListener('load',()=>setTimeout(checkUpdate,1500));
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkUpdate(); });
const BASE='https://raw.githubusercontent.com/TAKE2355/jma-maiji-v2/offline-cache/';
// raw.githubusercontent.com はブランチ名URLだとCDNに数分キャッシュされるため、
// コミットSHA固定のURLを解決して確実に最新を取得する（キャッシュの保存キーはBASEのまま）
const REPO='TAKE2355/jma-maiji-v2';
async function freshBase(){
  // ① 同一オリジンの cache-ver.txt（GitHub Pages）から最新SHAを取得
  //    GitHub APIに依存しないので、未認証の回数制限に引っかからない
  try{
    const r=await fetch('cache-ver.txt?cb='+Date.now(),{cache:'no-store'});
    if(r.ok){
      const sha=(await r.text()).trim();
      if(/^[0-9a-f]{40}$/.test(sha)) return 'https://raw.githubusercontent.com/'+REPO+'/'+sha+'/';
    }
  }catch(e){}
  // ② PATがあればGitHub APIで解決
  try{
    let h={};
    try{ const c=JSON.parse(localStorage.getItem('metair_v2')||'{}'); if(c.pat) h={'Authorization':'token '+c.pat}; }catch(e){}
    const r=await fetch('https://api.github.com/repos/'+REPO+'/branches/offline-cache',{headers:h,cache:'no-store'});
    if(r.ok){ const b=await r.json(); const sha=b&&b.commit&&b.commit.sha; if(sha) return 'https://raw.githubusercontent.com/'+REPO+'/'+sha+'/'; }
  }catch(e){}
  return BASE;
}

const CACHE='nimbus-offline-v1';
let MF=null, CACHE_MB="";

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw-offline.js',{updateViaCache:'none'})
    .then(reg=>{ reg.update(); setInterval(()=>reg.update(), 10*60*1000); }).catch(()=>{});
}


async function boot(){
  try{
    const c=await caches.open(CACHE);
    const hit=await c.match(BASE+'manifest.json',{ignoreSearch:true});
    if(hit){ MF=await hit.json(); render(); }
  }catch(e){}
  // オンラインなら最新のmanifestを取り直して構成を更新（画像はキャッシュのまま）
  try{
    const SRC=await freshBase();
    const r=await fetch(SRC+'manifest.json?t='+Date.now(),{cache:'no-store'});
    if(r.ok){
      const mf=await r.json();
      if(!MF || mf.generated_utc!==MF.generated_utc){
        // manifestだけ新しくして画像が古いままになるのを防ぐため、
        // 差分ダウンロード（数秒）をそのまま実行する
        await update(true);
      }
      // サーバのデータが古ければ収集そのものを起動する（トークン登録済みの端末のみ）
      try{
        let cfg={}; try{ cfg=JSON.parse(localStorage.getItem("metair_v2")||"{}"); }catch(e){}
        if(cfg.pat && cfg.repo && dataAgeMin(mf.generated_utc) > 35) update(false);
      }catch(e){}
    }
  }catch(e){}
}


// 取得済みデータの経過分数
function dataAgeMin(ts){
  if(!ts||ts.length<12) return 9999;
  const d=Date.UTC(+ts.slice(0,4),+ts.slice(4,6)-1,+ts.slice(6,8),+ts.slice(8,10),+ts.slice(10,12),+(ts.slice(12,14)||0));
  return (Date.now()-d)/60000;
}
// サーバ側の収集ワークフローを起動して完了まで待つ
function diag(msg){
  let e=document.getElementById("diag");
  if(!e){ e=document.createElement("div"); e.id="diag"; document.body.appendChild(e); }
  e.textContent=msg; e.classList.add("on");
  clearTimeout(window.__diagT);
  window.__diagT=setTimeout(()=>e.classList.remove("on"), 8000);
}
async function runCollection(b){
  let cfg={};
  try{ cfg=JSON.parse(localStorage.getItem('metair_v2')||'{}'); }catch(e){}
  if(!cfg.pat||!cfg.repo){ diag("トークン未設定：管理ページで登録してください"); return false; }
  const H={'Authorization':'token '+cfg.pat,'Content-Type':'application/json'};
  const API='https://api.github.com/repos/'+cfg.repo+'/actions/workflows/offline_cache.yml/runs';
  try{
    let prev=0;
    try{ const p=await (await fetch(API+'?per_page=1',{headers:H})).json();
         prev=(p.workflow_runs&&p.workflow_runs[0])?p.workflow_runs[0].id:0; }catch(e){}
    const d=await fetch('https://api.github.com/repos/'+cfg.repo+
      '/actions/workflows/offline_cache.yml/dispatches',
      {method:'POST',headers:H,body:JSON.stringify({ref:cfg.branch||'main'})});
    if(!d.ok){
      let m="";
      try{ m=(await d.json()).message||""; }catch(e){}
      diag("収集の起動に失敗 HTTP "+d.status+(m?"："+m:""));
      return false;
    }
    let runId=0;
    for(let i=0;i<20 && !runId;i++){
      await new Promise(r=>setTimeout(r,3000));
      const p=await (await fetch(API+'?per_page=1',{headers:H})).json();
      const r0=p.workflow_runs&&p.workflow_runs[0];
      if(r0 && r0.id!==prev) runId=r0.id;
    }
    if(!runId) return false;
    const t0=Date.now();
    for(let i=0;i<120;i++){
      await new Promise(r=>setTimeout(r,10000));
      const p=await (await fetch('https://api.github.com/repos/'+cfg.repo+'/actions/runs/'+runId,{headers:H})).json();
      const sec=Math.round((Date.now()-t0)/1000);
      if(b) b.textContent='COLLECTING '+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
      if(p.status==='completed') return p.conclusion==='success';
    }
  }catch(e){}
  return false;
}

async function update(quiet){
  const b=$('btn-update'), pr=$('prog'), bar=pr.firstElementChild;
  b.disabled=true; b.textContent=quiet?'AUTO SYNC…':'SYNCING…'; pr.style.display='block'; bar.style.width='0';
  try{
    const c=await caches.open(CACHE);
    let SRC=await freshBase();
    let r=await fetch(SRC+'manifest.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('manifest '+r.status);
    let mf=await r.json();
    // サーバ側のデータが40分以上古ければ、先に収集を走らせてから取り込む
    if(!quiet && dataAgeMin(mf.generated_utc) > 35){
      b.textContent='COLLECTING…';
      const ok=await runCollection(b);
      if(ok){
        SRC=await freshBase();
        const r2=await fetch(SRC+'manifest.json?t='+Date.now(),{cache:'no-store'});
        if(r2.ok) mf=await r2.json();
      }
      b.textContent='取得中…';
    }
    await c.put(BASE+'manifest.json', new Response(JSON.stringify(mf),{headers:{'Content-Type':'application/json'}}));
    const files=[];
    mf.categories.forEach(k=>{
      (k.items||[]).forEach(i=>{ if(i.file) files.push(i.file); });
      (k.series||[]).forEach(s=>(s.frames||[]).forEach(f=>files.push(f.file)));
    });
    ['offline.html','sw-offline.js','assets/top-icon-base.png?v=4',
      'assets/top-icon-bolt1.png?v=3','assets/top-icon-bolt2.png?v=3','assets/top-icon-bolt3.png?v=3']
      .forEach(f=>files.push('@'+f));
    let done=0, skipped=0;
    const q=files.slice();
    async function worker(){
      while(q.length){
        const f=q.shift();
        const isLocal = f.charAt(0)==='@';
        const url = isLocal ? new URL(f.slice(1), location.href).href : SRC+f;
        const key = isLocal ? url : BASE+f;      // 保存キーはBASE固定
        // 時刻入りのファイル名は内容が不変なので、持っていれば取得を省略
        let skip=false;
        if(!isLocal && /_\d{14}\.jpg$/.test(f)){
          try{ skip = !!(await c.match(key)); }catch(e){}
        }
        if(!skip){
          try{ const res=await fetch(url,{cache:'reload'});
               if(res.ok) await c.put(key, res.clone()); }catch(e){}
        }
        done++; if(skip) skipped++;
        bar.style.width=(done/files.length*100).toFixed(1)+'%';
        b.textContent=(quiet?'AUTO ':'SYNC ')+done+'/'+files.length;
      }
    }
    await Promise.all([worker(),worker(),worker(),worker(),worker(),worker()]);
    // manifestに存在しない古い画像を掃除（設定変更で不要になったファイル対策）
    try{
      const keep=new Set(files.filter(f=>f.charAt(0)!=='@').map(f=>BASE+f));
      keep.add(BASE+'manifest.json');
      let del=0;
      for(const k of await c.keys()){
        if(k.url.indexOf(BASE)!==0) continue;              // 自前アセットは対象外
        if(!keep.has(k.url.split('?')[0])){ await c.delete(k); del++; }
      }
      if(del) console.log('古いキャッシュを削除:',del,'件');
    }catch(e){}
    MF=mf; render();
    console.log('SYNC 完了: 新規取得 '+(files.length-skipped)+' / スキップ '+skipped);
    b.textContent='GET IT NOW!!';
    calcCacheSize();
  }catch(e){ b.textContent='SYNC FAILED'; console.error('sync',e); }
  finally{ b.disabled=false; setTimeout(()=>{pr.style.display='none';},900); }
}

function clickSound(high){
  try{
    _AC = _AC || new (window.AudioContext||window.webkitAudioContext)();
    if(_AC.state==='suspended') _AC.resume();
    const t=_AC.currentTime;
    const o=_AC.createOscillator(), g=_AC.createGain(), f=_AC.createBiquadFilter();
    o.type='square'; o.frequency.setValueAtTime(high?2200:1300,t);
    o.frequency.exponentialRampToValueAtTime(high?900:520,t+0.035);
    f.type='bandpass'; f.frequency.value=high?2000:1200; f.Q.value=1.2;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.30,t+0.002);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
    o.connect(f); f.connect(g); g.connect(_AC.destination);
    o.start(t); o.stop(t+0.06);
  }catch(e){}
}

// ══ ドラッグ＆ドロップ（長押し不要・ポインタ操作） ══════════════
function enableDrag(container, selector, onDrop, handle){
  if(!container) return;
  let src=null, moved=false;
  const items=()=>[...container.querySelectorAll(selector)];
  container.addEventListener('pointerdown', e=>{
    if(e.isPrimary===false) return;
    const el=e.target.closest(selector);
    if(!el || e.target.closest('.ovl')) return;
    // 入力欄などの操作は邪魔しない。ボタンは「項目そのもの」以外なら除外
    if(e.target.closest('input,textarea,select,label')) return;
    const _b=e.target.closest('button');
    if(_b && _b!==el) return;
    if(handle && !e.target.closest(handle)) return;
    src=el; moved=false;
    el.style.touchAction='none';
    el.setPointerCapture && el.setPointerCapture(e.pointerId);
  });
  container.addEventListener('pointermove', e=>{
    if(!src) return;
    if(!moved){
      if(Math.abs(e.movementX)+Math.abs(e.movementY) < 2) return;
      moved=true; src.classList.add('dragging'); clickSound(true);
    }
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const t=el&&el.closest(selector);
    items().forEach(x=>x.classList.toggle('dropzone', x===t && x!==src));
  });
  const finish=e=>{
    if(!src) return;
    const wasMoved=moved;
    let target=null;
    if(wasMoved){
      const el=document.elementFromPoint(e.clientX,e.clientY);
      target=el&&el.closest(selector);
    }
    items().forEach(x=>{x.classList.remove('dragging','dropzone'); x.style.touchAction='';});
    const s=src; src=null; moved=false;
    if(wasMoved && target && target!==s){
      clickSound(false);
      onDrop(items().indexOf(s), items().indexOf(target));
    }
  };
  container.addEventListener('pointerup', finish);
  container.addEventListener('pointercancel', ()=>{ 
    items().forEach(x=>{x.classList.remove('dragging','dropzone'); x.style.touchAction='';}); src=null; moved=false; });
}
function moveItem(arr,from,to){ if(from<0||to<0||from===to) return arr; const a=arr.slice(); const [x]=a.splice(from,1); a.splice(to,0,x); return a; }

// キャッシュ済みデータの合計容量を計算
async function calcCacheSize(){
  try{
    const c=await caches.open(CACHE);
    // 旧版で二重保存されたSHA固定URLのエントリを掃除
    for(const k of await c.keys()){
      if(/raw\.githubusercontent\.com\/[^/]+\/[^/]+\/[0-9a-f]{40}\//.test(k.url)) await c.delete(k);
    }
    const ks=await c.keys();
    let n=0;
    for(const k of ks){
      const res=await c.match(k);
      if(!res) continue;
      const b=await res.clone().arrayBuffer();
      n+=b.byteLength;
    }
    CACHE_MB=(n/1024/1024).toFixed(1);
    const s=$('stamp'); if(s&&MF) s.innerHTML='取得データ時刻 <b>'+tsLabel(MF.generated_utc)+'</b>　<b>'+CACHE_MB+' MB</b>';
  }catch(e){}
}

let GROUPS=[], setMode='page';
try{ GROUPS=JSON.parse(localStorage.getItem('nimbus_off_groups')||'[]')||[]; }catch(e){}
function syncGroups(){
  if(!MF) return;
  const seen=new Set();
  GROUPS.forEach(g=>(g.items||[]).forEach(it=>seen.add(it.cat+''+it.label)));
  (MF.categories||[]).forEach(k=>{
    if(k.mode==='text') return;
    const gid='g:'+(k.id||k.label);
    let g=GROUPS.find(x=>x.id===gid);
    if(!g){ g={id:gid,label:k.label,items:[]}; GROUPS.push(g); }
    rawSubs(k).forEach(s=>{
      const key=(k.id||k.label)+''+s.label;
      if(!seen.has(key)){ g.items.push({cat:(k.id||k.label),label:s.label}); seen.add(key); }
    });
  });
  // 実在しない項目を除去
  GROUPS.forEach(g=>{
    g.items=(g.items||[]).filter(it=>{
      const k=(MF.categories||[]).find(c=>(c.id||c.label)===it.cat);
      return k && rawSubs(k).some(s=>s.label===it.label);
    });
  });
}
function groupOf(cat,label){
  for(const g of GROUPS) if((g.items||[]).some(x=>x.cat===cat&&x.label===label)) return g;
  return null;
}
function renameGroup(gid,v){ const g=GROUPS.find(x=>x.id===gid); if(g){ g.label=v||'分類'; saveGroups(); renderSettings(); } }

  if(!confirm('分類「'+g.label+'」を削除します。よろしいですか？')) return;

}
function moveToGroup(cat,label,gid,index){
  GROUPS.forEach(g=>{ g.items=(g.items||[]).filter(x=>!(x.cat===cat&&x.label===label)); });
  const g=GROUPS.find(x=>x.id===gid); if(!g) return;
  if(index==null||index<0||index>g.items.length) g.items.push({cat,label});
  else g.items.splice(index,0,{cat,label});

function enableSourceDrag(){
  const wrap=$('src-wrap'); if(!wrap) return;
  let src=null,moved=false;
  wrap.addEventListener('pointerdown',e=>{
    if(!e.target.closest('.grip')) return;
    src=e.target.closest('.src-item'); moved=false;
    if(src) src.setPointerCapture&&src.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove',e=>{
    if(!src) return;
    if(!moved){ if(Math.abs(e.movementX)+Math.abs(e.movementY)<2) return; moved=true; src.classList.add('dragging'); clickSound(true); }
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const grp=el&&el.closest('.src-group');
    wrap.querySelectorAll('.src-group').forEach(x=>x.classList.toggle('dropzone',x===grp));
  });
  const fin=e=>{
    if(!src) return;
    const s=src, was=moved; src=null; moved=false;
    wrap.querySelectorAll('.src-group').forEach(x=>x.classList.remove('dropzone'));
    s.classList.remove('dragging');
    if(!was) return;
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const grp=el&&el.closest('.src-group');
    if(!grp) return;
    const over=el&&el.closest('.src-item');
    let idx=null;
    if(over&&over!==s){ const list=[...grp.querySelectorAll('.src-item')]; idx=list.indexOf(over); }
    moveToGroup(s.dataset.cat, s.dataset.label, grp.dataset.gid, idx);
  };
  wrap.addEventListener('pointerup',fin);
  wrap.addEventListener('pointercancel',()=>{ if(src){src.classList.remove('dragging');} src=null; moved=false;
    wrap.querySelectorAll('.src-group').forEach(x=>x.classList.remove('dropzone')); });
}

// ══ 収集状況（GitHub Actions 実行履歴）══════════════════════════
let HLOG=null, HLOG_T=0;
try{ HLOG=JSON.parse(localStorage.getItem("nimbus_off_hlog")||"null"); }catch(e){}
async function loadHLog(force){
  if(HLOG && !force && Date.now()-HLOG_T<60000) return HLOG;
  try{ const r=await fetch("cache-log.json?cb="+Date.now(),{cache:"no-store"});
       if(r.ok){ HLOG=await r.json(); HLOG_T=Date.now();
         try{ localStorage.setItem("nimbus_off_hlog",JSON.stringify(HLOG.slice(-200))); }catch(e){} } }catch(e){}
  return HLOG;
}
function jstStr(sec){ const d=new Date(sec*1000+9*3600000), p=n=>("0"+n).slice(-2);
  return p(d.getUTCMonth()+1)+"/"+p(d.getUTCDate())+" "+p(d.getUTCHours())+":"+p(d.getUTCMinutes()); }
function lastRun(){ return (HLOG&&HLOG.length)?HLOG[HLOG.length-1]:null; }
function updBeat(){ const e=$("hbeat"); if(!e) return; const L=lastRun();
  if(!L){ e.style.background="#666"; e.title="収集状況"; return; }
  const m=(Date.now()/1000-L.t)/60;
  e.style.background = m<25?"#2ecc71":(m<70?"#e6a23c":"#e74c3c");
  e.title="最終収集 "+jstStr(L.t)+" JST"; }
function openHealth(){ settingsOpen=true; setMode="health"; render(); }
async function renderHealth(){
  await loadHLog(true);
  const el=$("hzbody"); if(!el) return;
  const L=(HLOG||[]).slice(), now=Date.now()/1000, SLOT=[3,18,33,48];
  const first=L.length?L[0].t:now;
  const peak=L.reduce((m,x)=>Math.max(m,x.n||0),0);
  const THR=peak?Math.round(peak*0.95):700;
  const hourTop=Math.floor(now/3600)*3600;
  let ok=0, few=0, miss=0, rows="";
  for(let h=0;h<24;h++){
    const hs=hourTop-h*3600; let cells="";
    for(const m of SLOT){
      const t0=hs+m*60;
      if(t0>now-6*60||t0<first){ cells+='<div class="hcell fut"></div>'; continue; }
      const e=L.find(x=>Math.abs(x.t-t0)<=9*60);
      if(!e){ miss++; cells+='<div class="hcell" title="'+jstStr(t0)+' 欠測"></div>'; }
      else if((e.n||0)>=THR){ ok++; cells+='<div class="hcell ok" title="'+jstStr(e.t)+' '+e.n+'件"></div>'; }
      else { few++; cells+='<div class="hcell few" title="'+jstStr(e.t)+' '+(e.n||0)+'件"></div>'; }
    }
    const d=new Date(hs*1000+9*3600000);
    rows+='<div class="hrow"><b>'+("0"+d.getUTCHours()).slice(-2)+'時</b>'+cells+'</div>';
  }
  const last=L.length?L[L.length-1]:null;
  const age=last?Math.round((now-last.t)/60):null;
  let vc="#e74c3c", vt="収集が止まっている可能性があります";
  if(age!=null && age<=25){ vc="#2ecc71"; vt="正常に稼働中"; }
  else if(age!=null && age<=70){ vc="#e6a23c"; vt="やや遅延（GitHubの定期実行はしばしば遅れます）"; }
  if(!last){ vc="#888"; vt="記録がまだありません（次回の収集後に表示されます）"; }
  const done=ok+few, total=done+miss;
  let h="";
  h+='<div class="verdict" style="color:'+vc+'">● '+vt+'</div>';
  h+='<div class="big">'+(last?(jstStr(last.t)+" JST ／ "+(last.n||0)+"件 ／ "+(last.e==="schedule"?"定期":"手動")):"—")+'</div>';
  h+='<div class="sub">'+(age!=null?(age+"分前に収集"):"")+'</div>';
  h+='<h4>直近24時間の実行状況（1行＝1時間 / 4スロット）</h4>';
  h+='<div class="sub">実行 '+done+' ／ '+total+' スロット'+(miss?'（欠測 '+miss+'）':"")+'</div>';
  h+='<div class="hleg"><span><i style="background:#2ecc71"></i>正常('+THR+'件以上)</span>'
    +'<span><i style="background:#e6a23c"></i>件数不足</span>'
    +'<span><i style="background:#3a3a3a"></i>欠測</span>'
    +'<span><i style="background:#2a2a2a;border:1px dashed #444"></i>記録前／実行前</span></div>';
  h+=rows;
  h+='<h4>最近の実行</h4><div class="hlist">';
  for(const e of L.slice(-12).reverse())
    h+='<div><span>'+jstStr(e.t)+'</span><span>'+(e.n||0)+'件</span><span>'+(e.e==="schedule"?"定期":"手動")+'</span><span>'+(e.s||"")+'</span></div>';
  h+='</div>';
  h+='<h4>&nbsp;</h4><button class="btn" onclick="renderHealth()">再読み込み</button>';
  el.innerHTML=h; updBeat();
}
setTimeout(()=>{ loadHLog(true).then(updBeat); }, 1200);
setTimeout(drawMoon, 300);
setInterval(()=>{ loadHLog(true).then(updBeat); }, 5*60*1000);

let MTCFG={hide:[],order:[],hours:3,fs:13};
try{ MTCFG=Object.assign(MTCFG, JSON.parse(localStorage.getItem('nimbus_off_metar')||'{}')||{}); }catch(e){}
if(!Array.isArray(MTCFG.hide)) MTCFG.hide=[];
if(!Array.isArray(MTCFG.order)) MTCFG.order=[];
const saveMT=()=>{ try{ localStorage.setItem('nimbus_off_metar',JSON.stringify(MTCFG)); }catch(e){} };
function mtCat(){ return (MF&&MF.categories||[]).find(c=>c.mode==="text")||null; }
function mtAllIcao(){
  const c=mtCat(); if(!c) return [];
  const it=(c.items||[])[0]||{};
  return (it.groups||[]).map(g=>g.icao);
}
function mtOrderList(){
  const all=mtAllIcao();
  return (MTCFG.order&&MTCFG.order.length)? applyOrder(all, all, MTCFG.order) : all;
}
// METAR/TAF本文をブロック単位に分ける（TAFは継続行を含む）
function mtBlocks(text){
  const out=[]; let cur=null;
  String(text||"").split("\n").forEach(l=>{
    if(l.charAt(0)!==" " && /^(METAR|SPECI|TAF)\b/.test(l.trim())){
      cur={head:l.trim().split(/\s+/)[0], lines:[l]}; out.push(cur);
    }else if(cur){ cur.lines.push(l); }
    else { cur={head:"?", lines:[l]}; out.push(cur); }
  });
  return out;
}
// 観測時刻(ddhhmmZ)から経過時間を求める
function mtAgeH(line){
  const m=String(line).match(/\b(\d{2})(\d{2})(\d{2})Z\b/);
  if(!m) return null;
  const now=new Date();
  let t=Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), +m[1], +m[2], +m[3]);
  if(t-now.getTime() > 6*3600000) t=Date.UTC(now.getUTCFullYear(), now.getUTCMonth()-1, +m[1], +m[2], +m[3]);
  return (now.getTime()-t)/3600000;
}
function mtFilter(text, hours){
  const bs=mtBlocks(text);
  const keep=bs.filter(b=>{
    if(b.head!=="METAR" && b.head!=="SPECI") return true;   // TAF等は常に表示
    const a=mtAgeH(b.lines[0]);
    return (a===null) || (a<=hours+0.05);
  });
  const s=keep.map(b=>b.lines.join("\n")).join("\n").replace(/\n{3,}/g,"\n\n").trim();
  return s || "（指定範囲内のデータなし）";
}
function mtToggle(ic,on){
  const i=MTCFG.hide.indexOf(ic);
  if(on){ if(i>=0) MTCFG.hide.splice(i,1); } else if(i<0) MTCFG.hide.push(ic);
  saveMT(); renderSettings(); render();
}
function mtAll(on){ MTCFG.hide = on? [] : mtOrderList().slice(); saveMT(); renderSettings(); render(); }
function mtMove(ic,d){
  const l=mtOrderList(), i=l.indexOf(ic), j=i+d;
  if(i<0||j<0||j>=l.length) return;
  MTCFG.order=moveItem(l,i,j); saveMT(); renderSettings(); render(); clickSound(d<0);
}
function mtSet(k,v){ MTCFG[k]=+v; saveMT(); render(); }
function mtPanel(){
  const list=mtOrderList();
  const shown=list.filter(ic=>MTCFG.hide.indexOf(ic)<0).length;
  let h='<div class="mt-cfg">';
  h+='<div class="mt-row"><b>表示範囲</b><select onchange="mtSet(\'hours\',this.value)">'
    + [1,2,3,6,9,12].map(v=>'<option value="'+v+'"'+(MTCFG.hours===v?" selected":"")+'>過去'+v+'時間</option>').join("")
    + '</select><span class="set-hint">TAFは範囲に関わらず常に表示されます</span></div>';
  h+='<div class="mt-row"><b>文字サイズ</b><select onchange="mtSet(\'fs\',this.value)">'
    + [[11,"小"],[13,"中"],[16,"大"],[19,"特大"],[23,"最大"]].map(v=>'<option value="'+v[0]+'"'+(MTCFG.fs===v[0]?" selected":"")+'>'+v[1]+'</option>').join("")
    + '</select></div>';
  h+='<div class="mt-row"><b>空港</b><span class="set-hint">'+shown+' / '+list.length+' 表示中　≡ をつかむか▲▼で並べ替え</span>'
    + '<button class="btn" onclick="mtAll(1)">全選択</button>'
    + '<button class="btn" onclick="mtAll(0)">全解除</button></div>';
  h+='<div id="mt-list">'
    + list.map(ic=>'<div class="mt-item" data-icao="'+ic+'"><span class="grip">≡</span>'
        + '<label><input type="checkbox" '+(MTCFG.hide.indexOf(ic)<0?"checked":"")
        + ' onchange="mtToggle(\''+ic+'\',this.checked)"> '+ic+'</label>'
        + '<button class="mv" onclick="mtMove(\''+ic+'\',-1)">▲</button>'
        + '<button class="mv" onclick="mtMove(\''+ic+'\',1)">▼</button></div>').join("")
    + '</div></div>';
  return h;
}

// 日の出・日の入り（NOAAの近似式・誤差1分程度）
function sunTimes(lat, lon, when){
  const rad=Math.PI/180, J1970=2440588, J2000=2451545, dayMs=86400000, J0=0.0009;
  const lw=rad*-lon, phi=rad*lat;
  const d=when.getTime()/dayMs - 0.5 + J1970 - J2000;
  const n=Math.round(d - J0 - lw/(2*Math.PI));
  const ds=J0 + lw/(2*Math.PI) + n;
  const M=rad*(357.5291 + 0.98560028*ds);
  const C=rad*(1.9148*Math.sin(M) + 0.02*Math.sin(2*M) + 0.0003*Math.sin(3*M));
  const L=M + C + rad*102.9372 + Math.PI;
  const dec=Math.asin(Math.sin(rad*23.4397)*Math.sin(L));
  const Jnoon=J2000 + ds + 0.0053*Math.sin(M) - 0.0069*Math.sin(2*L);
  const cw=(Math.sin(rad*-0.833) - Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec));
  if(cw>1||cw<-1) return null;
  const a=J0 + (Math.acos(cw) + lw)/(2*Math.PI) + n;
  const Jset=J2000 + a + 0.0053*Math.sin(M) - 0.0069*Math.sin(2*L);
  const fromJ=j=>(j + 0.5 - J1970)*dayMs;
  return {rise:fromJ(Jnoon-(Jset-Jnoon)), set:fromJ(Jset)};
}
function hhmm(ms, off){
  const d=new Date(ms+off*3600000), p=n=>("0"+n).slice(-2);
  return p(d.getUTCHours())+":"+p(d.getUTCMinutes());
}
function sunLabel(icao){
  const a=AP_POS[String(icao||"").toUpperCase()];
  if(!a) return "";
  const now=new Date();
  const local=new Date(now.getTime()+a[2]*3600000);
  const base=new Date(Date.UTC(local.getUTCFullYear(),local.getUTCMonth(),local.getUTCDate()));
  const s=sunTimes(a[0],a[1],base);
  if(!s) return "";
  return "↑"+hhmmz(s.rise)+"・↓"+hhmmz(s.set);
}
function hhmmz(ms){
  const d=new Date(ms), p=n=>("0"+n).slice(-2);
  return p(d.getUTCHours())+p(d.getUTCMinutes())+"z";
}
// 月齢（0=新月, 0.5=満月）

function moonName(p){
  if(p<0.033||p>=0.967) return "新月";
  if(p<0.217) return "三日月";
  if(p<0.283) return "上弦";
  if(p<0.467) return "十三夜月";
  if(p<0.533) return "満月";
  if(p<0.717) return "寝待月";
  if(p<0.783) return "下弦";
  return "有明月";
}
function moonInfo(){
  const p=moonPhase(new Date());
  const age=(p*29.530588853).toFixed(1);
  const ill=Math.round((1-Math.cos(2*Math.PI*p))/2*100);
  return moonName(p)+"　月齢 "+age+"　輝面比 "+ill+"%";
}
function showMoonTip(){
  const mo=$("moon"); if(!mo) return;
  let e=document.getElementById("moontip");
  if(!e){ e=document.createElement("div"); e.id="moontip"; document.body.appendChild(e); }
  e.textContent=moonInfo();
  const r=mo.getBoundingClientRect();
  e.style.left=Math.max(8, Math.min(window.innerWidth-250, r.left-30))+"px";
  e.style.top=(r.bottom+8)+"px";
  e.classList.add("on");
  clearTimeout(window.__moonT);
  window.__moonT=setTimeout(()=>e.classList.remove("on"), 4000);
}
function moonPhase(when){
  const SYN=29.530588853;
  const known=Date.UTC(2000,0,6,18,14);
  let p=(((when.getTime()-known)/86400000)%SYN)/SYN;
  if(p<0) p+=1;
  return p;
}
function moonSVG(size){
  const p=moonPhase(new Date()), r=size/2-1, cx=size/2, cy=size/2;
  const t=Math.cos(2*Math.PI*p);
  const so=(p<0.5)?1:0;
  const si=(t>0)?1-so:so;
  const rx=Math.max(0.001,Math.abs(t)*r);
  const lit="M "+cx+" "+(cy-r)+" A "+r+" "+r+" 0 0 "+so+" "+cx+" "+(cy+r)
          + " A "+rx+" "+r+" 0 0 "+si+" "+cx+" "+(cy-r)+" Z";
  const age=(p*29.530588853).toFixed(1);
  const ill=Math.round((1-Math.cos(2*Math.PI*p))/2*100);
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" aria-label="月齢'+age+'">'
    + '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#1b1e22" stroke="#4a5058" stroke-width="1"/>'
    + '<path d="'+lit+'" fill="#f2e6bf"/>'
    + '<title>月齢 '+age+'　輝面比 '+ill+'%</title></svg>';
}
function drawMoon(){ const e=$("moon"); if(!e) return; e.innerHTML=moonSVG(26); e.onclick=showMoonTip; }

let MTDATA=null;
try{ MTDATA=JSON.parse(localStorage.getItem("nimbus_off_metarjson")||"null"); }catch(e){}
async function loadMetarJson(){
  try{
    const r=await fetch("metar.json?cb="+Date.now(),{cache:"no-store"});
    if(r.ok){
      const j=await r.json();
      if(j && j.groups && j.groups.length){
        MTDATA=j;
        try{ localStorage.setItem("nimbus_off_metarjson",JSON.stringify(j)); }catch(e){}
        return j;
      }
    }
  }catch(e){}
  return null;
}
function mtGroupsNow(it){
  const base=(it&&it.groups)||[];
  if(MTDATA && MTDATA.groups && MTDATA.groups.length){
    if(!MF || !MF.generated_utc || String(MTDATA.generated_utc) >= String(MF.generated_utc)) return MTDATA.groups;
  }
  return base;
}
function mtWhen(){
  if(!MTDATA || !MTDATA.generated_utc) return "";
  const s=String(MTDATA.generated_utc);
  try{
    const d=new Date(Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),+s.slice(8,10),+s.slice(10,12)));
    const p=n=>("0"+n).slice(-2), j=new Date(d.getTime()+9*3600000);
    return p(j.getUTCMonth()+1)+"/"+p(j.getUTCDate())+" "+p(j.getUTCHours())+":"+p(j.getUTCMinutes());
  }catch(e){ return ""; }
}
async function mtSync(){
  const b=$("btn-update");
  let cfg={}; try{ cfg=JSON.parse(localStorage.getItem("metair_v2")||"{}"); }catch(e){}
  if(!cfg.pat || !cfg.repo){ diag("トークン未設定：管理ページで登録してください"); return; }
  const before=(MTDATA&&String(MTDATA.generated_utc))||"";
  const H={"Authorization":"token "+cfg.pat,"Content-Type":"application/json"};
  const old=b.textContent;
  b.disabled=true; b.textContent="METAR取得中…";
  try{
    const d=await fetch("https://api.github.com/repos/"+cfg.repo+
      "/actions/workflows/metar_only.yml/dispatches",
      {method:"POST",headers:H,body:JSON.stringify({ref:cfg.branch||"main"})});
    if(!d.ok){
      let m=""; try{ m=(await d.json()).message||""; }catch(e){}
      diag("METAR収集の起動に失敗 HTTP "+d.status+(m?"："+m:""));
      return;
    }
    for(let i=0;i<40;i++){
      await new Promise(r=>setTimeout(r,4000));
      const j=await loadMetarJson();
      if(j && String(j.generated_utc)!==before){ render(); diag("METAR/TAF を更新しました（"+mtWhen()+" JST）"); return; }
    }
    diag("METARの更新待ちがタイムアウトしました。少し待って再度お試しください");
  }catch(e){
    diag("METAR収集でエラー: "+String(e).slice(0,60));
  }finally{
    b.disabled=false; b.textContent=old;
  }
}

// ── サーバ側でラベルが変わった項目に、保存済み設定を追随させる ──
//   並び順・非表示・表示名・ページ構成・分類はラベル文字列で保存されているため、
//   配信側で名称を変えると設定が外れてしまう。不変IDで前回名を覚えて置換する。
function migrateLabels(){
  if(!MF||!MF.categories) return;
  let map={}; try{ map=JSON.parse(localStorage.getItem("nimbus_off_idlabel")||"{}")||{}; }catch(e){}
  const cur={}, renames=[];
  MF.categories.forEach(c=>{
    const cid=c.id||c.label;
    (c.series||[]).forEach(s=>{ if(s.key) cur[cid+"\u0002s:"+s.key]=s.label; });
    (c.items||[]).forEach(o=>{ if(o.file) cur[cid+"\u0002f:"+o.file]=o.label; });
  });
  for(const k in cur){
    const old=map[k];
    if(old && old!==cur[k]) renames.push([k.split("\u0002")[0], old, cur[k]]);
  }
  if(renames.length){
    renames.forEach(function(r){
      const cid=r[0], from=r[1], to=r[2];
      if(ORD[cid])    ORD[cid]    = ORD[cid].map(l=>l===from?to:l);
      if(HIDDEN[cid]) HIDDEN[cid] = HIDDEN[cid].map(l=>l===from?to:l);
      const ok=lkey(cid,from), nk=lkey(cid,to);
      if(LABELS[ok]!==undefined && LABELS[nk]===undefined){ LABELS[nk]=LABELS[ok]; delete LABELS[ok]; }
      (PAGES||[]).forEach(p=>(p.items||[]).forEach(it=>{ if(it.cat===cid&&it.label===from) it.label=to; }));
      (GROUPS||[]).forEach(g=>(g.items||[]).forEach(it=>{ if(it.cat===cid&&it.label===from) it.label=to; }));
      (CATITEMS&&Object.keys(CATITEMS).forEach(kk=>{
        const v=CATITEMS[kk];
        if(Array.isArray(v)) v.forEach(it=>{ if(it&&it.cat===cid&&it.label===from) it.label=to; });
      }));
    });
    try{ saveOrd(); }catch(e){}
    try{ savePages(); }catch(e){}
  }
  try{ localStorage.setItem("nimbus_off_idlabel", JSON.stringify(cur)); }catch(e){}
}

  // 左端ツール + サブタブ

    + '</span>'
    + subs.map((s,i)=>'<button class="sb'+(i===zoomIdx?' active':'')+'" onclick="setZoom('+i+')">'+esc(s.label)+'</button>').join('')
    + '<span class="tools right">'
    + '<span class="lbl">列</span><select id="ly-c">'+[1,2,3,4,5,6].map(n=>'<option'+(n===LAY().cols?' selected':'')+'>'+n+'</option>').join('')+'</select>'
    + '</span>';
  enableDrag($('subs'),'button.sb',(from,to)=>{
    const _c=curTab(); if(!_c) return;
    setTabItems(_c, moveItem(tabItems(_c),from,to));
    if(zoomIdx===from) zoomIdx=to; else if(from<zoomIdx&&to>=zoomIdx) zoomIdx--; else if(from>zoomIdx&&to<=zoomIdx) zoomIdx++;
    render();
  });
  $('bulk').onclick=toggleBulk;
  const bulkStop=()=>{ bulkPlaying=false; $('bulk').innerHTML=ICO.play; $('bulk').classList.remove('playing'); };
  $('b-first').onclick=()=>{bulkStop(); TILES.forEach(t=>{stop(t); t.idx=0; show(t); flash(t);});};
  $('b-prev').onclick=()=>{bulkStop(); TILES.forEach(t=>{stop(t); step(t,-1); flash(t);});};
  $('b-next').onclick=()=>{bulkStop(); TILES.forEach(t=>{stop(t); step(t,1); flash(t);});};
  $('b-last').onclick=()=>TILES.forEach(t=>{stop(t); t.idx=Math.max(0,((t.s.frames||[]).length-1)); show(t); flash(t);});
  $('ly-c').onchange=e=>{LAY().cols=+e.target.value;saveLay();render();};

  $('textview').style.display='none'; $('grid').style.display='grid';
  buildGrid(subs);

let TILES=[];
function buildGrid(subs){
  TILES.forEach(t=>{ if(t.timer) clearInterval(t.timer); });
  TILES=[];
  const g=$('grid');
  const list = (zoomIdx>=0 && subs[zoomIdx]) ? [subs[zoomIdx]] : subs;
  const cols = (zoomIdx>=0)?1:LAY().cols;
  g.style.gridTemplateColumns='repeat('+cols+',minmax(0,1fr))';
  g.className = (zoomIdx>=0)?'zoom':'';
  g.innerHTML = list.map((s,i)=>
    '<div class="tile" data-i="'+i+'">'
    + '<div class="tag">'+esc(s.label)+'</div>'
    + '<img alt="">'
    + (s.kind==='series' && (s.frames||[]).length>1
       ? '<div class="ovl"><button class="fs" title="最古">'+ICO.first+'</button>'
         +'<button class="pv" title="1コマ戻す">'+ICO.prev+'</button>'
         +'<button class="p" title="再生／停止">'+ICO.play+'</button>'
         +'<button class="nx" title="1コマ送る">'+ICO.next+'</button>'
         +'<button class="ls" title="最新">'+ICO.last+'</button><span class="cap"></span></div>' : '')
    + '</div>').join('');

  [...g.children].forEach((el,i)=>{
    const s=list[i];
    const t={el, s, idx:(s.kind==='series'? Math.max(0,(s.frames||[]).length-1):0), timer:null,
             img:el.querySelector('img'), cap:el.querySelector('.cap'),
             play:el.querySelector('.p'), hideT:null};
    TILES.push(t);
    show(t);
    // タイル操作 → オーバーレイを1秒表示
    ['pointerdown','pointermove','wheel','touchstart','touchmove'].forEach(ev=>
      el.addEventListener(ev,()=>flash(t),{passive:true}));
    el.addEventListener('click',e=>{
      if(e.target.closest('.ovl')) return;
      setZoom(zoomIdx>=0 ? -1 : (function(){ // グリッド→ズーム
        const subsAll=subsOf(MF.categories[catIdx]); return subsAll.indexOf(s)>=0?subsAll.indexOf(s):i; })());
    });
    if(t.play){
      t.play.onclick=e=>{e.stopPropagation(); togglePlay(t); flash(t);};
      el.querySelector('.fs').onclick=e=>{e.stopPropagation(); stop(t); t.idx=0; show(t); flash(t);};
      el.querySelector('.pv').onclick=e=>{e.stopPropagation(); stop(t); step(t,-1); flash(t);};
      el.querySelector('.nx').onclick=e=>{e.stopPropagation(); stop(t); step(t,1); flash(t);};
      el.querySelector('.ls').onclick=e=>{e.stopPropagation(); stop(t); t.idx=Math.max(0,(t.s.frames||[]).length-1); show(t); flash(t);};
      if(bulkPlaying) play(t);
    }
  });
}

function show(t){
  if(t.s.kind==='series'){
    const f=(t.s.frames||[])[t.idx];
    if(f){ t.img.src=BASE+f.file;
           if(t.cap) t.cap.textContent=tsShort(f.ts); }
  }else{
    t.img.src=BASE+t.s.file;
  }
}

// ── 再生UIを「そのタイルの見えている範囲」の中央に置く ──
//    ズームやスクロールで画像の中心が画面外へ出ても、UIが隠れないようにする。
let _ovlRAF=0;
function placeOvls(){
  if(_ovlRAF) return;
  _ovlRAF=setTimeout(function(){
    _ovlRAF=0;
    const w=$("gwrap");
    if(!w || typeof TILES==="undefined" || !TILES || !TILES.length) return;
    const vr=w.getBoundingClientRect();
    TILES.forEach(function(t){
      const el=t&&t.el; if(!el) return;
      const ov=el.querySelector(".ovl"); if(!ov) return;
      const tr=el.getBoundingClientRect();
      const L=Math.max(tr.left,vr.left),  R=Math.min(tr.right,vr.right);
      const T=Math.max(tr.top,vr.top),    B=Math.min(tr.bottom,vr.bottom);
      if(R<=L || B<=T){ ov.style.visibility="hidden"; return; }
      ov.style.visibility="";
      const iw=R-L, ih=B-T;
      // 見えている範囲に収まるまで段階的にUIを小さくする
      ov.classList.remove("mini","micro");
      let ow=ov.offsetWidth, oh=ov.offsetHeight;
      if(iw < ow+8 || ih < oh+8){
        ov.classList.add("mini");
        ow=ov.offsetWidth; oh=ov.offsetHeight;
        if(iw < ow+8 || ih < oh+8){
          ov.classList.remove("mini"); ov.classList.add("micro");
          ow=ov.offsetWidth; oh=ov.offsetHeight;
        }
      }
      const pad=Math.max(0, Math.min(4, Math.floor(Math.min(iw-ow, ih-oh)/2)));
      // 見えている範囲の右下を狙い、タイルからはみ出さない位置に寄せる
      let x=R-tr.left-ow/2-pad, y=B-tr.top-oh/2-pad;
      const loX=ow/2+pad, hiX=Math.max(loX, tr.width -ow/2-pad);
      const loY=oh/2+pad, hiY=Math.max(loY, tr.height-oh/2-pad);
      x=Math.min(Math.max(x,loX),hiX);
      y=Math.min(Math.max(y,loY),hiY);
      ov.style.left=x+"px";
      ov.style.top =y+"px";
    });
  },0);
}
(function(){
  const w=$("gwrap");
  if(w) w.addEventListener("scroll", placeOvls, {passive:true});
  window.addEventListener("resize", placeOvls);
})();

function showTags(){
  clearTimeout(showTags._t);
  TILES.forEach(t=>t.el.classList.add('tagon'));
  showTags._t=setTimeout(()=>TILES.forEach(t=>t.el.classList.remove('tagon')),2000);
}
['pointerdown','touchstart','wheel','keydown'].forEach(ev=>
  document.addEventListener(ev,showTags,{passive:true}));

function flash(t){
  t.el.classList.add('act');
  t.el.classList.add('actcap');
  placeOvls();
  if(t.hideT)  clearTimeout(t.hideT);
  if(t.hideT2) clearTimeout(t.hideT2);
  // ボタンは2秒、時刻は10秒で消す
  t.hideT =setTimeout(()=>{ t.el.classList.remove('act');    placeOvls(); }, 2000);
  t.hideT2=setTimeout(()=>{ t.el.classList.remove('actcap'); placeOvls(); }, 10000);
}
function step(t,d){
  const n=(t.s.frames||[]).length; if(!n) return;
  t.idx=(t.idx+d+n)%n; show(t);
}
function play(t){
  if(t.timer||t.s.kind!=='series') return;
  const n=(t.s.frames||[]).length; if(n<2) return;
  if(t.idx>=n-1) t.idx=0;
  show(t);
  if(t.play){ t.play.innerHTML=ICO.pause; t.play.classList.add('playing'); }
  t.timer=setInterval(()=>{ t.idx=(t.idx>=n-1)?0:t.idx+1; show(t); },220);
}
function stop(t){
  if(t.timer){clearInterval(t.timer);t.timer=null;}
  if(t.play){ t.play.innerHTML=ICO.play; t.play.classList.remove('playing'); }
}
function togglePlay(t){ t.timer?stop(t):play(t); }
function toggleBulk(){
  bulkPlaying=!bulkPlaying;
  $('bulk').innerHTML=bulkPlaying?ICO.pause:ICO.play;
  $('bulk').classList.toggle('playing',bulkPlaying);
  TILES.forEach(t=>bulkPlaying?play(t):stop(t));
}

function setZoom(i){ zoomIdx=(zoomIdx===i? -1 : i); render(); }

// 画面の残り高さにグリッドを収める
function fitArea(){
  const hd=document.querySelector('header'), ct=$('cats'), sb=$('subs');
  const used=(hd?hd.offsetHeight:0)+(ct?ct.offsetHeight:0)
            +(sb&&getComputedStyle(sb).display!=='none'?sb.offsetHeight:0)+16;
  const h=Math.max(200, window.innerHeight-used);
  const w=$('gwrap'); if(w) w.style.height=h+'px';
  const st=$('settings'); if(st) st.style.height=h+'px';
  $('grid').style.height = (zoomIdx>=0)? h+'px' : '';
  $('textview').style.maxHeight=h+'px';
  [...$('grid').children].forEach(el=>{ el.style.height = (zoomIdx>=0)? h+'px' : ''; });
}
window.addEventListener('resize',fitArea);
// 単独表示（ズーム表示）中は高さもGZ倍にして画像を実際に拡大させる
function applySingleSize(){
  const w=$('gwrap'), g=$('grid');
  if(!w||!g) return;
  if(typeof zoomIdx==='undefined'||zoomIdx<0) return;
  const base=parseFloat(w.style.height)||w.clientHeight;
  if(!base) return;
  const hh=Math.round(base*(typeof GZ==='number'?GZ:1));
  g.style.height=hh+'px';
  [...g.children].forEach(el=>{ el.style.height=hh+'px'; });
}
(function(){ const _f=fitArea; fitArea=function(){ _f.apply(this,arguments); try{ applySingleSize(); }catch(e){} try{ placeOvls(); }catch(e){} }; })();


// ── 画像エリアのみピンチズーム（ヘッダ・タブは固定） ──
let GZ=1;
function applyZoom(cx,cy,prev){
  const w=$('gwrap'), g=$('grid');
  if(!w||!g) return;
  const rect=w.getBoundingClientRect();
  const px=(cx==null? rect.width/2 : cx-rect.left);
  const py=(cy==null? rect.height/2 : cy-rect.top);
  const x=w.scrollLeft+px, y=w.scrollTop+py;
  const k=GZ/(prev||1);
  g.style.width=(GZ*100)+'%';
  applySingleSize();
  w.scrollLeft=x*k-px;
  w.scrollTop =y*k-py;
  showTags(); TILES.forEach(t=>flash(t));
  placeOvls();
}
function setZoomLevel(z,cx,cy){
  const prev=GZ;
  GZ=Math.min(6,Math.max(1,z));
  if(GZ!==prev) applyZoom(cx,cy,prev);
}
(function(){
  const w=$('gwrap'); if(!w) return;
  w.addEventListener('wheel',e=>{
    if(!(e.ctrlKey||e.metaKey)) return;
    e.preventDefault();
    setZoomLevel(GZ*(e.deltaY<0?1.12:0.89), e.clientX, e.clientY);
  },{passive:false});
  let d0=0,z0=1,cx=0,cy=0;
  w.addEventListener('touchstart',e=>{
    if(e.touches.length!==2) return;
    const a=e.touches[0], b=e.touches[1];
    d0=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    cx=(a.clientX+b.clientX)/2; cy=(a.clientY+b.clientY)/2; z0=GZ;
  },{passive:false});
  w.addEventListener('touchmove',e=>{
    if(e.touches.length!==2||!d0) return;
    e.preventDefault();
    const a=e.touches[0], b=e.touches[1];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    cx=(a.clientX+b.clientX)/2; cy=(a.clientY+b.clientY)/2;
    setZoomLevel(z0*d/d0, cx, cy);
  },{passive:false});
  w.addEventListener('touchend',()=>{ d0=0; },{passive:true});
  w.addEventListener('dblclick',e=>setZoomLevel(GZ>1?1:2.5,e.clientX,e.clientY));
})();
function flashAll(){ TILES.forEach(t=>flash(t)); showTags(); }
['scroll','wheel','touchmove','gesturechange','gestureend'].forEach(ev=>{
  const g=$('gwrap')||$('grid'); if(g) g.addEventListener(ev,flashAll,{passive:true});
});
window.addEventListener('scroll',flashAll,{passive:true});

<script>
/* TOPアイコン: 3つの雷をそれぞれランダムなタイミングで光らせる */
(function(){

    bolts.forEach(function(el){
      function fire(){
        el.classList.remove('flash');
        void el.offsetWidth;          /* reflow でアニメを再スタート */
        el.classList.add('flash');
        setTimeout(fire, 700 + Math.random()*2600);
      }
      setTimeout(fire, Math.random()*3500);
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);
  else start();
})();
</script>
<script>
/* NIMBUSロゴ: 30秒ごとに10種の演出からランダムに1つ再生 */
(function(){
  var FX=[]; for(var n=1;n<=100;n++) FX.push('fx'+n);
  function start(){
    var el=document.getElementById('nimbus-logo');
    if(!el) return;
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    function play(){
      FX.forEach(function(f){el.classList.remove(f);});
      void el.offsetWidth;                       /* reflow でアニメを再スタート */
      el.classList.add(FX[Math.floor(Math.random()*FX.length)]);
    }
    setTimeout(play, 1200);
    setInterval(play, 30000);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);
  else start();
})();
</script>
</body>
